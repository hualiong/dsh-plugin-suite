# @hualiong/dsh-plugin-suite bundle layer.
#
# One install unit: every row below names the component package that owns it,
# so the plugin detail page reads that package's own title, description and
# icon instead of this bundle's.
#
# Rows are ordinary loader entries: each one can be disabled, re-enabled or
# deleted on its own (the plugin manager writes that into the profile patch
# file), and each browser half is loaded independently by its own package.
#
# This bundle deliberately ships NO MCP server row. @hualiong/dsh-oauth-mcp-client
# is installed as a dependency (so an OAuth-protected HTTP server can be added at
# any time), but a row is what starts a server — a pre-filled one would put a
# server nobody asked for into every profile that installs this bundle. Add
# servers from Setup → MCP in the MCP Manager panel, or write the row yourself:
#
#   - insert:
#       - id: oauth-mcp-example
#         name: <bridge package, e.g. '@hualiong/dsh-oauth-mcp-client'>
#         config:
#           serverName: example
#           url: https://mcp.example.com/mcp
#           credentialRef: EXAMPLE_MCP_OAUTH
#           failOnStartupError: false
- insert:
    - id: mcp-manager
      name: '@hualiong/dsh-mcp-manager'
    - id: chameleon-session-delete
      name: '@hualiong/dsh-session-delete'
    # Enabled like the component's own bundle layer: with no bot credentials it
    # stays idle (logs「尚未配置 QQ 机器人。」) and waits for Settings → QQ机器人,
    # so an enabled row changes nothing until a bot is connected.
    - id: hualiong-dsh-qq-bot
      name: '@hualiong/dsh-qq-bot'
      config:
        toolEnabled: true
    # Disabled on purpose: the cost meter is opt-in, so installing the bundle
    # does not change what a session displays. Enable it from the plugin detail
    # page or from a profile patch layer (`- id: cost-lite` + `disabled: false`).
    - id: cost-lite
      name: '@hualiong/dsh-cost-lite'
      disabled: true
