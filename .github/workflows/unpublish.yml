name: Unpublish a version

# Temporary: withdraws a mistakenly published version through npm's trusted
# publishing (OIDC). Deleted once the version is gone.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to unpublish, e.g. 1.2.0'
        required: true
        default: '1.2.0'

permissions:
  contents: read
  id-token: write

jobs:
  unpublish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Use the newest npm
        run: npm install -g npm@latest

      - name: Unpublish
        run: |
          pkg="$(node -p "require('./package.json').name" 2>/dev/null || echo '@hualiong/dsh-plugin-suite')"
          echo "unpublishing ${pkg}@${{ inputs.version }}"
          npm unpublish "${pkg}@${{ inputs.version }}" --force
