name: Publish to npm

# Trusted publishing (OIDC): npm authenticates the workflow through GitHub's
# OIDC token, so no long-lived token and no repository secret is involved.
# The package's trusted publisher must be bound on npm to this repository and
# to this file name (publish.yml), with an empty environment name.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  # Required by trusted publishing and by `npm publish --provenance`.
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Deliberately no `registry-url`: it would write an .npmrc holding an
      # empty `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` placeholder,
      # which shadows the OIDC credential.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Use the newest npm
        # Trusted publishing requires npm >= 11.5.1.
        run: npm install -g npm@latest

      - name: Validate bundle contents
        run: |
          node --input-type=commonjs -e "
            const fs = require('node:fs');
            const required = ['cordis.patch.yml', 'locale/en.json', 'locale/zh.json', 'README.md', 'LICENSE'];
            for (const file of required) {
              if (!fs.existsSync(file)) { console.error('missing ' + file); process.exit(1); }
            }
            const patch = fs.readFileSync('cordis.patch.yml', 'utf8');
            const rows = (patch.match(/name: '@hualiong\//g) || []).length;
            if (rows < 3) { console.error('expected 3 component rows, found ' + rows); process.exit(1); }
            console.log('bundle ok: ' + rows + ' component rows');
          "

      - name: Tag must match package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      - name: Skip when this version is already published
        id: published
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "$(node -p "require('./package.json').name")@${version}" version >/dev/null 2>&1; then
            echo "already published: ${version}"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish
        if: steps.published.outputs.skip != 'true'
        run: npm publish --access public --provenance
